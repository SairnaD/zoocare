name: Deploy to Self-Hosted Runner

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      container_name:
        description: 'Docker container name'
        required: false
        default: 'team5-zoocare-app'
      server_port:
        description: 'Application port'
        required: false
        default: '3500'
      startup_sleep_seconds:
        description: 'Seconds to wait after starting the container'
        required: false
        default: '5'

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      APP_CONTAINER_NAME: ${{ github.event.inputs.container_name || 'team5-zoocare-app' }}
      APP_IMAGE_NAME: team5-zoocare-app
      DB_CONTAINER_NAME: team5-zoocare-db
      DB_VOLUME_NAME: team5-zoocare-pgdata
      DB_SERVER_PORT: '3555'
      DOCKER_NETWORK: team5-zoocare-net
      DB_NAME: zoocare
      DB_USER: zoocare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for name in DB_PASSWORD ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.6'

      - name: Extract deployment information
        id: deployment-info
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          BRANCH="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          COMMIT="${GITHUB_SHA::7}"
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          PORT_INPUT="${{ github.event.inputs.server_port }}"
          
          if [ -z "$PORT_INPUT" ]; then
            PORT_INPUT="3500"
          fi
          
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "server_port=$PORT_INPUT" >> "$GITHUB_OUTPUT"
          
          echo "Deployment Info:"
          echo "  Branch: $BRANCH"
          echo "  Commit: $COMMIT"
          echo "  Timestamp: $TIMESTAMP"
          echo "  App Port: $PORT_INPUT"
          echo "  DB Port: $DB_SERVER_PORT"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Resolve build artifact
        id: build-artifact
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' | head -n 1)
          
          if [ -z "$JAR_FILE" ]; then
            echo "No packaged jar found in target/"
            ls -la target || true
            exit 1
          fi
          
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Resolved jar: $JAR_FILE"

      - name: Check Docker availability
        run: docker version

      - name: Build application image
        env:
          JAR_FILE: ${{ steps.build-artifact.outputs.jar_file }}
          APP_IMAGE_TAG: ${{ env.APP_IMAGE_NAME }}:${{ steps.deployment-info.outputs.commit }}
        run: |
          docker build \
            --build-arg JAR_FILE=$JAR_FILE \
            -t $APP_IMAGE_TAG \
            -t $APP_IMAGE_NAME:latest \
            .

      - name: Stop existing application (if running)
        continue-on-error: true
        run: |
          docker rm -f $APP_CONTAINER_NAME || true
          sleep 2

      - name: Start database (keeps existing data)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$DOCKER_NETWORK"
          
          if docker ps -a --format '{{.Names}}' | grep -qx "$DB_CONTAINER_NAME"; then
            CURRENT_DB_PORT=$(docker inspect -f '{{with (index .HostConfig.PortBindings "5432/tcp")}}{{(index . 0).HostPort}}{{end}}' "$DB_CONTAINER_NAME" | tail -n 1 | tr -d '\r')
          
            if [ "$CURRENT_DB_PORT" != "$DB_SERVER_PORT" ]; then
              echo "Recreating database container with port $DB_SERVER_PORT"
              docker rm -f "$DB_CONTAINER_NAME"
            fi
          fi
          
          if docker ps -a --format '{{.Names}}' | grep -qx "$DB_CONTAINER_NAME"; then
            docker start "$DB_CONTAINER_NAME" >/dev/null
          else
            docker run -d \
              --name "$DB_CONTAINER_NAME" \
              --restart unless-stopped \
              --network "$DOCKER_NETWORK" \
              -p "$DB_SERVER_PORT:5432" \
              -e POSTGRES_DB="$DB_NAME" \
              -e POSTGRES_USER="$DB_USER" \
              -e POSTGRES_PASSWORD="$DB_PASSWORD" \
              -v "$DB_VOLUME_NAME":/var/lib/postgresql/data \
              --health-cmd="pg_isready -U $DB_USER -d $DB_NAME" \
              --health-interval=5s --health-timeout=3s --health-retries=12 \
              postgres:17
          fi
          
          for i in {1..30}; do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$DB_CONTAINER_NAME" | tail -n 1 | tr -d '\r')
          
            if [ "$STATUS" = "healthy" ]; then
              echo "Database is healthy"
              exit 0
            fi
          
            echo "Attempt $i: database status is $STATUS"
            sleep 2
          done
          
          echo "Database did not become healthy"
          docker logs --tail 50 "$DB_CONTAINER_NAME" || true
          exit 1

      - name: Start application container
        env:
          SERVER_PORT: ${{ steps.deployment-info.outputs.server_port }}
          DEPLOYMENT_BRANCH: ${{ steps.deployment-info.outputs.branch }}
          DEPLOYMENT_COMMIT: ${{ steps.deployment-info.outputs.commit }}
          DEPLOYMENT_TIMESTAMP: ${{ steps.deployment-info.outputs.timestamp }}
          STARTUP_SLEEP_SECONDS: ${{ github.event.inputs.startup_sleep_seconds || '5' }}
          APP_IMAGE_TAG: ${{ env.APP_IMAGE_NAME }}:${{ steps.deployment-info.outputs.commit }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
        run: |
          docker run -d \
            --name $APP_CONTAINER_NAME \
            --restart unless-stopped \
            --network $DOCKER_NETWORK \
            -p $SERVER_PORT:$SERVER_PORT \
            -e SERVER_PORT=$SERVER_PORT \
            -e SPRING_PROFILES_ACTIVE=postgres \
            -e DB_URL="jdbc:postgresql://$DB_CONTAINER_NAME:5432/$DB_NAME" \
            -e DB_USER="$DB_USER" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e ADMIN_USERNAME="${ADMIN_USERNAME:-admin}" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e DEPLOYMENT_BRANCH="$DEPLOYMENT_BRANCH" \
            -e DEPLOYMENT_COMMIT="$DEPLOYMENT_COMMIT" \
            -e DEPLOYMENT_TIMESTAMP="$DEPLOYMENT_TIMESTAMP" \
            $APP_IMAGE_TAG
          
          sleep "$STARTUP_SLEEP_SECONDS"
          echo "Application container started on port $SERVER_PORT"
          docker ps --filter "name=$APP_CONTAINER_NAME"

      - name: Verify deployment
        env:
          SERVER_PORT: ${{ steps.deployment-info.outputs.server_port }}
        run: |
          for i in {1..30}; do
            if ! docker ps --format '{{.Names}}' | grep -qx "$APP_CONTAINER_NAME"; then
              echo "Application container is not running"
              docker logs $APP_CONTAINER_NAME || true
              exit 1
            fi
          
            if docker logs $APP_CONTAINER_NAME 2>&1 | grep -q "Started CareApplication in"; then
              echo "Application container is running and Spring Boot has started"
              docker ps --filter "name=$APP_CONTAINER_NAME"
              exit 0
            fi
          
            echo "Attempt $i: Waiting for Spring Boot startup confirmation..."
            sleep 2
          done
          
          echo "Application did not report successful startup in logs"
          docker logs $APP_CONTAINER_NAME || true
          exit 1

      - name: Display application logs
        if: always()
        run: docker logs --tail 50 $APP_CONTAINER_NAME || true
