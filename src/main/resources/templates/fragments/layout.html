<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} - ZooCare|">ZooCare</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/zoocare.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark zc-navbar">
    <div class="container">
        <a class="navbar-brand" sec:authorize="isAnonymous()" th:href="@{/}">
            <img th:src="@{/images/logo-nav.svg}" width="32" height="32" alt="">ZooCare
        </a>
        <a class="navbar-brand" sec:authorize="isAuthenticated()" th:href="@{/dashboard}">
            <img th:src="@{/images/logo-nav.svg}" width="32" height="32" alt="">ZooCare
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto gap-lg-1">
                <th:block sec:authorize="hasRole('ADMIN')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/enclosures}"
                           th:classappend="${currentUri?.startsWith('/admin/enclosures')} ? 'active'">Enclosures</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/species}"
                           th:classappend="${currentUri?.startsWith('/admin/species')} ? 'active'">Species</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/animals}"
                           th:classappend="${currentUri?.startsWith('/admin/animals')} ? 'active'">Animals</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/keepers}"
                           th:classappend="${currentUri?.startsWith('/admin/keepers')} ? 'active'">Keepers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/feedings}"
                           th:classappend="${currentUri?.startsWith('/admin/feedings')} ? 'active'">Feeding history</a>
                    </li>
                </th:block>
                <th:block sec:authorize="hasRole('KEEPER')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/keeper}"
                           th:classappend="${currentUri == '/keeper'} ? 'active'">My animals</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/keeper/feedings}"
                           th:classappend="${currentUri?.startsWith('/keeper/feedings')} ? 'active'">Feeding history</a>
                    </li>
                </th:block>
            </ul>
            <ul class="navbar-nav align-items-lg-center gap-2">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </li>
                <li class="nav-item d-flex align-items-center gap-2 text-white fw-semibold"
                    sec:authorize="isAuthenticated()">
                    <span class="zc-user-icon" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
                    <span sec:authentication="name">username</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<header th:fragment="authHeader" class="navbar navbar-dark zc-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/logo-nav.svg}" width="32" height="32" alt="">ZooCare
        </a>
    </div>
</header>

<th:block th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success d-flex align-items-start gap-2" role="status">
        <i class="bi bi-check-lg" aria-hidden="true"></i>
        <span th:text="${successMessage}">Saved</span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-start gap-2" role="alert">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <span th:text="${errorMessage}">Error</span>
    </div>
</th:block>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
