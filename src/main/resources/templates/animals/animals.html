<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animals</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; }
        .success { background: #e6f4ea; color: #1e6b34; padding: .75rem; border-radius: 4px; }
        .empty { color: #666; margin-top: 1rem; }
        .button { display: inline-block; padding: .5rem 1rem; background: #1a73e8; color: #fff; text-decoration: none; border-radius: 4px; }
        img.thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
<h1>Animals</h1>

<div class="success" th:if="${param.created}">Animal was added successfully.</div>

<p><a class="button" th:href="@{/addAnimal}">+ Add animal</a></p>

<p class="empty" th:if="${#lists.isEmpty(animals)}">No animals yet.</p>

<table th:unless="${#lists.isEmpty(animals)}">
    <thead>
    <tr>
        <th>Photo</th>
        <th>Name</th>
        <th>Species</th>
        <th>Enclosure</th>
        <th>Birth date</th>
        <th>Weight (kg)</th>
        <th>Size (cm)</th>
        <th>Feeding every</th>
        <th>Health</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="a : ${animals}">
        <td><img class="thumb" th:if="${a.photo != null and !#strings.isEmpty(a.photo)}" th:src="@{/photos/{f}(f=${a.photo})}" th:alt="${a.name}"></td>
        <td th:text="${a.name}">Leo</td>
        <td th:text="${a.speciesName}">Lion</td>
        <td th:text="${a.enclosureName}">Savannah</td>
        <td th:text="${a.birthDate}">2020-05-01</td>
        <td th:text="${a.weight}">180.5</td>
        <td th:text="${a.size}">120</td>
        <td th:text="${a.feedingInterval != null} ? ${a.feedingInterval.toHours()} + ' h' : '-'">6 h</td>
        <td th:text="${a.healthStatus}">HEALTHY</td>
    </tr>
    </tbody>
</table>
</body>
</html>
