<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add animal</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; }
        input, select, textarea { width: 100%; padding: .5rem; margin-top: .25rem; box-sizing: border-box; }
        .error { color: #b00020; font-size: .85rem; }
        .global-error { background: #fdecea; color: #b00020; padding: .75rem; border-radius: 4px; margin-bottom: 1rem; }
        button { margin-top: 1.5rem; padding: .6rem 1.2rem; cursor: pointer; }
        .hint { color: #666; font-size: .8rem; }
    </style>
</head>
<body>
<h1>Add animal</h1>
<p><a th:href="@{/animals}">&larr; Back to all animals</a></p>

<form th:action="@{/addAnimal}" th:object="${createAnimalRequest}" method="post" enctype="multipart/form-data">

    <div class="global-error" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
    </div>

    <label for="name">Name</label>
    <input id="name" type="text" th:field="*{name}">
    <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

    <label for="speciesId">Species</label>
    <select id="speciesId" th:field="*{speciesId}">
        <option value="">-- select species --</option>
        <option th:each="s : ${speciesList}" th:value="${s.id}" th:text="${s.name}"></option>
    </select>
    <span class="error" th:if="${#fields.hasErrors('speciesId')}" th:errors="*{speciesId}"></span>

    <label for="enclosureId">Enclosure</label>
    <select id="enclosureId" th:field="*{enclosureId}">
        <option value="">-- select enclosure --</option>
        <option th:each="e : ${enclosures}" th:value="${e.id}" th:text="${e.name}"></option>
    </select>
    <span class="error" th:if="${#fields.hasErrors('enclosureId')}" th:errors="*{enclosureId}"></span>

    <label for="birthDate">Birth date</label>
    <input id="birthDate" type="date" th:field="*{birthDate}">
    <span class="error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>

    <label for="weight">Weight (kg)</label>
    <input id="weight" type="number" step="0.1" min="0" th:field="*{weight}">
    <span class="error" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></span>

    <label for="size">Size (cm)</label>
    <input id="size" type="number" min="0" th:field="*{size}">
    <span class="error" th:if="${#fields.hasErrors('size')}" th:errors="*{size}"></span>

    <label for="feedingIntervalHours">Feeding interval</label>
    <input id="feedingIntervalHours" type="number" min="1" max ="24" th:field="*{feedingIntervalHours}">
    <span class="error" th:if="${#fields.hasErrors('feedingIntervalHours')}" th:errors="*{feedingIntervalHours}"></span>

    <label for="description">Description</label>
    <textarea id="description" rows="4" th:field="*{description}"></textarea>
    <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>

    <label for="photo">Photo</label>
    <input id="photo" type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/gif">
    <span class="hint">JPG, PNG, WebP or GIF, up to 5 MB</span>
    <span class="error" th:if="${#fields.hasErrors('photo')}" th:errors="*{photo}"></span>

    <br><button type="submit">Save animal</button>
</form>
</body>
</html>
