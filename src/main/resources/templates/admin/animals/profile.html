<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${animal.name()})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="zc-form-card">
        <a th:href="@{/admin/animals}" class="btn btn-outline-secondary btn-sm mb-3">&larr; All animals</a>
        <div class="card">
            <div class="card-body">
                <h1 class="h4" th:text="${animal.name()}">Leo</h1>
                <p class="text-secondary" th:if="${animal.description() != null}"
                   th:text="${animal.description()}">Description</p>
                <dl class="row mb-0">
                    <dt class="col-5">Species</dt>
                    <dd class="col-7" th:text="${animal.speciesName()}">Lion</dd>
                    <dt class="col-5">Enclosure</dt>
                    <dd class="col-7" th:text="${animal.enclosureName()}">Savanna 1</dd>
                    <dt class="col-5">Birth date</dt>
                    <dd class="col-7" th:text="${animal.birthDate()}">2020-05-01</dd>
                    <dt class="col-5">Weight</dt>
                    <dd class="col-7" th:text="|${animal.weight()} kg|">180.5 kg</dd>
                    <dt class="col-5">Feeding every</dt>
                    <dd class="col-7" th:text="|${animal.feedingIntervalHours()} h|">6 h</dd>
                </dl>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
