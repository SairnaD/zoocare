<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${enclosureId == null} ? 'New enclosure' : 'Edit enclosure')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <form th:action="${enclosureId == null} ? @{/admin/enclosures} : @{/admin/enclosures/{id}(id=${enclosureId})}"
          th:object="${enclosureRequest}" method="post" novalidate class="card zc-form-card">

        <div class="card-header bg-transparent py-3">
            <h1 class="h5 mb-0" th:text="${enclosureId == null} ? 'New enclosure' : 'Edit enclosure'">New enclosure</h1>
        </div>

        <div class="card-body">
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Name</label>
                <input type="text" th:field="*{name}" th:errorclass="is-invalid" class="form-control">
                <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback d-flex gap-1">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:errors="*{name}">Name error</span>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-sm-6">
                    <label for="habitatType" class="form-label fw-semibold">Habitat</label>
                    <select th:field="*{habitatType}" th:errorclass="is-invalid" class="form-select">
                        <option value="">Choose habitat...</option>
                        <option th:each="habitat : ${habitatTypes}" th:value="${habitat}"
                                th:text="${#strings.capitalize(#strings.toLowerCase(habitat))}">Savanna</option>
                    </select>
                    <div th:if="${#fields.hasErrors('habitatType')}" class="invalid-feedback d-flex gap-1">
                        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                        <span th:errors="*{habitatType}">Habitat error</span>
                    </div>
                </div>

                <div class="col-sm-6">
                    <label for="capacity" class="form-label fw-semibold">Capacity</label>
                    <input type="number" min="1" th:field="*{capacity}" th:errorclass="is-invalid"
                           class="form-control">
                    <div class="form-text">Maximum number of animals.</div>
                    <div th:if="${#fields.hasErrors('capacity')}" class="invalid-feedback d-flex gap-1">
                        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                        <span th:errors="*{capacity}">Capacity error</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-footer bg-transparent d-flex justify-content-end gap-2 py-3">
            <a th:href="@{/admin/enclosures}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
