<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${speciesId == null} ? 'New species' : 'Edit species')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <form th:action="${speciesId == null} ? @{/admin/species} : @{/admin/species/{id}(id=${speciesId})}"
          th:object="${speciesRequest}" method="post" novalidate class="card zc-form-card">

        <div class="card-header bg-transparent py-3">
            <h1 class="h5 mb-0" th:text="${speciesId == null} ? 'New species' : 'Edit species'">New species</h1>
        </div>

        <div class="card-body">
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Name</label>
                <input type="text" th:field="*{name}" th:errorclass="is-invalid" class="form-control">
                <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback d-flex gap-1">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:errors="*{name}">Name error</span>
                </div>
            </div>

            <div class="mb-3">
                <label for="habitatType" class="form-label fw-semibold">Habitat type</label>
                <select th:field="*{habitatType}" th:errorclass="is-invalid" class="form-select">
                    <option value="">Choose habitat...</option>
                    <option th:each="habitat : ${habitatTypes}" th:value="${habitat}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(habitat))}">Savanna</option>
                </select>
                <div th:if="${#fields.hasErrors('habitatType')}" class="invalid-feedback d-flex gap-1">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:errors="*{habitatType}">Habitat error</span>
                </div>
            </div>

            <div>
                <label for="dietType" class="form-label fw-semibold">Diet type</label>
                <select th:field="*{dietType}" th:errorclass="is-invalid" class="form-select">
                    <option value="">Choose diet...</option>
                    <option th:each="diet : ${dietTypes}" th:value="${diet}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(diet))}">Carnivore</option>
                </select>
                <div th:if="${#fields.hasErrors('dietType')}" class="invalid-feedback d-flex gap-1">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:errors="*{dietType}">Diet error</span>
                </div>
            </div>
        </div>

        <div class="card-footer bg-transparent d-flex justify-content-end gap-2 py-3">
            <a th:href="@{/admin/species}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
