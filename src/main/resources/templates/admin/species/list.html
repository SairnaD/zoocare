<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Species')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="h3 mb-0">Species</h1>
        <a th:href="@{/admin/species/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> Add species
        </a>
    </div>

    <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

    <div th:if="${#lists.isEmpty(speciesList)}" class="card zc-empty">
        <span class="zc-empty-icon" aria-hidden="true"><i class="bi bi-list"></i></span>
        <h2 class="h5 mb-1">No species yet</h2>
        <p class="text-secondary mb-0">Add a species with its habitat and diet type before adding animals.</p>
    </div>

    <div th:unless="${#lists.isEmpty(speciesList)}" class="card overflow-hidden">
        <div class="card-header bg-transparent py-3">
            <h2 class="h5 mb-0">All species
                <span class="text-secondary fw-medium" th:text="|(${#lists.size(speciesList)})|">(7)</span>
            </h2>
        </div>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Habitat type</th>
                    <th scope="col">Diet type</th>
                    <th scope="col" class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="species : ${speciesList}">
                    <td class="fw-semibold" th:text="${species.name}">Lion</td>
                    <td>
                        <span class="chip"
                              th:classappend="|chip-${#strings.toLowerCase(species.habitatType)}|"
                              th:text="${#strings.capitalize(#strings.toLowerCase(species.habitatType))}">Savanna</span>
                    </td>
                    <td th:text="${#strings.capitalize(#strings.toLowerCase(species.dietType))}">Carnivore</td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-2">
                            <a th:href="@{/admin/species/{id}/edit(id=${species.id})}"
                               class="btn btn-outline-secondary btn-sm">Edit</a>
                            <form th:action="@{/admin/species/{id}/delete(id=${species.id})}" method="post"
                                  onsubmit="return confirm('Delete this species?');">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
