<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${speciesId == null} ? 'New species' : 'Edit species')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <h1 class="h3 mb-4" th:text="${speciesId == null} ? 'New species' : 'Edit species'">New species</h1>

            <form th:action="${speciesId == null} ? @{/admin/species} : @{/admin/species/{id}(id=${speciesId})}"
                  th:object="${speciesRequest}" method="post" novalidate>

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" th:field="*{name}" th:errorclass="is-invalid" class="form-control">
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                         class="invalid-feedback">Name error</div>
                </div>

                <div class="mb-3">
                    <label for="habitatType" class="form-label">Habitat</label>
                    <select th:field="*{habitatType}" th:errorclass="is-invalid" class="form-select">
                        <option value="">Choose habitat...</option>
                        <option th:each="habitat : ${habitatTypes}"
                                th:value="${habitat}" th:text="${habitat}">SAVANNA</option>
                    </select>
                    <div th:if="${#fields.hasErrors('habitatType')}" th:errors="*{habitatType}"
                         class="invalid-feedback">Habitat error</div>
                </div>

                <div class="mb-4">
                    <label for="dietType" class="form-label">Diet</label>
                    <select th:field="*{dietType}" th:errorclass="is-invalid" class="form-select">
                        <option value="">Choose diet...</option>
                        <option th:each="diet : ${dietTypes}"
                                th:value="${diet}" th:text="${diet}">CARNIVORE</option>
                    </select>
                    <div th:if="${#fields.hasErrors('dietType')}" th:errors="*{dietType}"
                         class="invalid-feedback">Diet error</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Save</button>
                    <a th:href="@{/admin/species}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
